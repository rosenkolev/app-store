# Moves each app to the latest release of its repository (daily, or on demand).
# CasaOS and Docker Apps read the repository directly, so a commit is all it takes.
name: Update apps

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Update app versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -q pyyaml
          changed=$(python scripts/update.py)
          python scripts/validate.py
          if [ -n "$changed" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qam "Update $(echo "$changed" | paste -sd ', ')"
            git push -q
            echo "Updated: $changed"
          fi
